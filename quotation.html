<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอใบเสนอราคา | SM91 จำกัด</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<section class="quote-page">
    <div class="quote-form-box">

        <h1>ขอใบเสนอราคา</h1>

        <p>
            กรอกข้อมูลของคุณ แล้วทีมงาน SM91 จะติดต่อกลับโดยเร็วที่สุด
        </p>

        <form action="https://formsubmit.co/sm91ni@gmail.com" method="POST">

            <!-- 1. ชื่อผู้ติดต่อ -->
            <label>
                ชื่อผู้ติดต่อ <span class="red-star">*</span>
            </label>

            <input
                type="text"
                name="ชื่อผู้ติดต่อ"
                placeholder="กรอกชื่อผู้ติดต่อ"
                required
            >


            <!-- 2. ประเภทบริการ -->
            <label>
                ประเภทบริการ <span class="red-star">*</span>
            </label>

            <select name="ประเภทบริการ" id="serviceType" required>

                <option value="" selected disabled>
                    เลือกประเภทบริการ
                </option>

                <option value="งานช่างซ่อมบำรุงและดูแลระบบสาธารณูปโภค">
                    งานช่างซ่อมบำรุงและดูแลระบบสาธารณูปโภค
                </option>

                <option value="งานบริหารนิติบุคคล">
                    งานบริหารนิติบุคคล
                </option>

                <option value="งานจดจัดตั้งนิติบุคคล">
                    งานจดจัดตั้งนิติบุคคล
                </option>

                <option value="งานจัดประชุมใหญ่">
                    งานจัดประชุมใหญ่
                </option>

                <option value="ล้างเครื่องปรับอากาศ">
                    ล้างเครื่องปรับอากาศ
                </option>

                <option value="งานกล้อง CCTV">
                    งานกล้อง CCTV
                </option>

                <option value="อื่น ๆ">
                    อื่น ๆ
                </option>

            </select>


            <!-- งานอื่น ๆ -->
            <div id="otherServiceFields" style="display: none;">

                <label>
                    รายละเอียดงาน <span class="red-star">*</span>
                </label>

                <textarea
                    name="รายละเอียดงานอื่น ๆ"
                    id="otherServiceDetail"
                    placeholder="กรอกรายละเอียดงานที่ต้องการ"
                    rows="5"
                ></textarea>

            </div>


            <!-- งานช่าง -->
            <div id="maintenanceFields" style="display: none;">

                <label>
                    ชื่อโครงการ <span class="red-star">*</span>
                </label>

                <input
                    type="text"
                    name="ชื่อโครงการ"
                    id="projectName"
                    placeholder="กรอกชื่อโครงการ"
                >

                <label>
                    จำนวนยูนิต <span class="red-star">*</span>
                </label>

                <input
                    type="number"
                    name="จำนวนยูนิต"
                    id="unitCount"
                    placeholder="กรอกจำนวนยูนิต"
                    min="1"
                >

                <label>
                    จำนวนอัตราพนักงานที่ต้องการ
                    (ระบุตำแหน่งอะไรบ้าง และตำแหน่งละกี่อัตรา)
                    <span class="red-star">*</span>
                </label>

                <input
                    type="text"
                    name="จำนวนอัตราพนักงานที่ต้องการ"
                    id="staffCount"
                    placeholder="ระบุตำแหน่งและจำนวนอัตรา"
                >

                <label>
                    รายละเอียดเพิ่มเติม
                </label>

                <textarea
                    name="รายละเอียดงานช่าง"
                    id="maintenanceDetail"
                    placeholder="กรอกรายละเอียดเพิ่มเติม (ถ้ามี)"
                    rows="5"
                ></textarea>

            </div>


            <!-- งานบริหารนิติบุคคล -->
            <div id="managementFields" style="display: none;">

                <label>
                    ชื่อโครงการ <span class="red-star">*</span>
                </label>

                <input
                    type="text"
                    name="ชื่อโครงการนิติบุคคล"
                    id="managementProjectName"
                    placeholder="กรอกชื่อโครงการ"
                >

                <label>
                    จำนวนยูนิต <span class="red-star">*</span>
                </label>

                <input
                    type="number"
                    name="จำนวนยูนิตนิติบุคคล"
                    id="managementUnitCount"
                    placeholder="กรอกจำนวนยูนิต"
                    min="1"
                >

                <label>
                    จำนวนอัตราพนักงานที่ต้องการ
                    (ระบุตำแหน่งอะไรบ้าง และตำแหน่งละกี่อัตรา)
                    <span class="red-star">*</span>
                </label>

                <input
                    type="text"
                    name="จำนวนอัตราพนักงานนิติบุคคล"
                    id="managementStaffCount"
                    placeholder="ระบุตำแหน่งและจำนวนอัตรา"
                >

                <label>
                    รายละเอียดเพิ่มเติม
                </label>

                <textarea
                    name="รายละเอียดงานบริหารนิติบุคคล"
                    id="managementDetail"
                    placeholder="กรอกรายละเอียดเพิ่มเติม (ถ้ามี)"
                    rows="5"
                ></textarea>

            </div>


            <!-- งานจดจัดตั้งนิติบุคคล -->
            <div id="establishmentFields" style="display: none;">

                <label>
                    ชื่อโครงการ <span class="red-star">*</span>
                </label>

                <input
                    type="text"
                    name="ชื่อโครงการจดจัดตั้งนิติบุคคล"
                    id="establishmentProjectName"
                    placeholder="กรอกชื่อโครงการ"
                >

                <label>
                    จำนวนยูนิต <span class="red-star">*</span>
                </label>

                <input
                    type="number"
                    name="จำนวนยูนิตจดจัดตั้งนิติบุคคล"
                    id="establishmentUnitCount"
                    placeholder="กรอกจำนวนยูนิต"
                    min="1"
                >

                <label>
                    รายละเอียดเพิ่มเติม
                </label>

                <textarea
                    name="รายละเอียดงานจดจัดตั้งนิติบุคคล"
                    id="establishmentDetail"
                    placeholder="กรอกรายละเอียดเพิ่มเติม (ถ้ามี)"
                    rows="5"
                ></textarea>

            </div>


            <!-- งานจัดประชุมใหญ่ -->
            <div id="meetingFields" style="display: none;">

                <label>
                    ชื่อโครงการ <span class="red-star">*</span>
                </label>

                <input
                    type="text"
                    name="ชื่อโครงการจัดประชุมใหญ่"
                    id="meetingProjectName"
                    placeholder="กรอกชื่อโครงการ"
                >

                <label>
                    จำนวนยูนิต <span class="red-star">*</span>
                </label>

                <input
                    type="number"
                    name="จำนวนยูนิตจัดประชุมใหญ่"
                    id="meetingUnitCount"
                    placeholder="กรอกจำนวนยูนิต"
                    min="1"
                >

                <label>
                    วันที่กำหนดจัดประชุมใหญ่ <span class="red-star">*</span>
                </label>

                <input
                    type="date"
                    name="วันที่กำหนดจัดประชุมใหญ่"
                    id="meetingDate"
                >

                <label>
                    รายละเอียดเพิ่มเติม
                </label>

                <textarea
                    name="รายละเอียดงานจัดประชุมใหญ่"
                    id="meetingDetail"
                    placeholder="กรอกรายละเอียดเพิ่มเติม (ถ้ามี)"
                    rows="5"
                ></textarea>

            </div>


            <!-- งานล้างเครื่องปรับอากาศ -->
            <div id="airconFields" style="display: none;">

                <label>
                    ชื่อสถานที่รับบริการ <span class="red-star">*</span>
                </label>

                <input
                    type="text"
                    name="ชื่อสถานที่รับบริการ"
                    id="airconLocation"
                    placeholder="กรอกชื่อสถานที่รับบริการ"
                >

                <label>
                    ประเภทเครื่องปรับอากาศ <span class="red-star">*</span>
                </label>

                <select
                    name="ประเภทเครื่องปรับอากาศ"
                    id="airconType"
                >

                    <option value="" selected disabled>
                        เลือกประเภทเครื่องปรับอากาศ
                    </option>

                    <option value="แอร์บ้าน">
                        แอร์บ้าน
                    </option>

                    <option value="แอร์แขวน">
                        แอร์แขวน
                    </option>

                    <option value="แอร์ติดผนัง">
                        แอร์ติดผนัง
                    </option>

                    <option value="แอร์สี่ทิศทาง">
                        แอร์สี่ทิศทาง
                    </option>

                    <option value="อื่น ๆ">
                        อื่น ๆ
                    </option>

                </select>

                <input
                    type="text"
                    name="ประเภทเครื่องปรับอากาศอื่น ๆ"
                    id="airconOtherType"
                    placeholder="ระบุประเภทเครื่องปรับอากาศ"
                    style="display: none;"
                >

                <label>
                    ขนาด BTU <span class="red-star">*</span>
                </label>

                <input
                    type="text"
                    name="ขนาด BTU"
                    id="airconBTU"
                    placeholder="กรอกขนาด BTU"
                >

                <label>
                    จำนวนเครื่อง <span class="red-star">*</span>
                </label>

                <input
                    type="number"
                    name="จำนวนเครื่อง"
                    id="airconCount"
                    placeholder="กรอกจำนวนเครื่อง"
                    min="1"
                >

                <label>
                    รายละเอียดเพิ่มเติม
                </label>

                <textarea
                    name="รายละเอียดงานล้างเครื่องปรับอากาศ"
                    id="airconDetail"
                    placeholder="กรอกรายละเอียดเพิ่มเติม (ถ้ามี)"
                    rows="5"
                ></textarea>

            </div>


            <!-- งานกล้อง CCTV -->
            <div id="cctvFields" style="display: none;">

                <label>
                    ชื่อสถานที่รับบริการ <span class="red-star">*</span>
                </label>

                <input
                    type="text"
                    name="ชื่อสถานที่รับบริการ CCTV"
                    id="cctvLocation"
                    placeholder="กรอกชื่อสถานที่รับบริการ"
                >

                <label>
                    ประเภทงาน CCTV <span class="red-star">*</span>
                </label>

                <select
                    name="ประเภทงาน CCTV"
                    id="cctvType"
                >

                    <option value="" selected disabled>
                        เลือกประเภทงาน CCTV
                    </option>

                    <option value="ซ่อมแซม">
                        ซ่อมแซม
                    </option>

                    <option value="MA">
                        MA
                    </option>

                    <option value="ติดตั้ง">
                        ติดตั้ง
                    </option>

                </select>

                <label>
                    จำนวนกล้อง <span class="red-star">*</span>
                </label>

                <input
                    type="number"
                    name="จำนวนกล้อง"
                    id="cctvCount"
                    placeholder="กรอกจำนวนกล้อง"
                    min="1"
                >

                <label>
                    รายละเอียดเพิ่มเติม
                </label>

                <textarea
                    name="รายละเอียดงาน CCTV"
                    id="cctvDetail"
                    placeholder="กรอกรายละเอียดเพิ่มเติม (ถ้ามี)"
                    rows="5"
                ></textarea>

            </div>


            <!-- 4. เบอร์โทร -->
            <label>
                เบอร์โทร <span class="red-star">*</span>
            </label>

            <input
                type="tel"
                name="เบอร์โทร"
                placeholder="กรอกเบอร์โทร"
                pattern="[0-9]{9,10}"
                maxlength="10"
                inputmode="numeric"
                title="กรุณากรอกเบอร์โทร 9-10 หลัก โดยใช้ตัวเลขเท่านั้น"
                required
            >


            <!-- 5. อีเมล -->
            <label>
                อีเมล <span class="red-star">*</span>
            </label>

            <input
                type="email"
                name="อีเมล"
                placeholder="กรอกอีเมล"
                autocomplete="email"
                title="กรุณากรอกอีเมลให้ถูกต้อง เช่น example@email.com"
                required
            >


            <!-- 6. Line ID -->
            <label>
                Line ID <span class="red-star">*</span>
            </label>

            <input
                type="text"
                name="Line ID"
                id="lineId"
                placeholder="กรอก Line ID"
                required
            >


            <!-- FormSubmit -->
            <input type="hidden" name="_captcha" value="false">

            <input
                type="hidden"
                name="_subject"
                value="มีลูกค้าขอใบเสนอราคาใหม่จากเว็บไซต์ SM91"
            >

            <input
                type="hidden"
                name="_template"
                value="table"
            >

            <input
                type="hidden"
                name="_next"
                value="thankyou.html"
            >


            <!-- ปุ่มส่ง -->
            <button type="submit">

                <i class="fa-solid fa-paper-plane"></i>

                ส่งคำขอใบเสนอราคา

            </button>

        </form>


        <a href="index.html" class="back-home">
            กลับหน้าแรก
        </a>

    </div>
</section>


<script>

const serviceType = document.getElementById("serviceType");

const serviceSections = {

    "งานช่างซ่อมบำรุงและดูแลระบบสาธารณูปโภค":
        document.getElementById("maintenanceFields"),

    "งานบริหารนิติบุคคล":
        document.getElementById("managementFields"),

    "งานจดจัดตั้งนิติบุคคล":
        document.getElementById("establishmentFields"),

    "งานจัดประชุมใหญ่":
        document.getElementById("meetingFields"),

    "ล้างเครื่องปรับอากาศ":
        document.getElementById("airconFields"),

    "งานกล้อง CCTV":
        document.getElementById("cctvFields"),

    "อื่น ๆ":
        document.getElementById("otherServiceFields")

};


function updateServiceFields() {

    Object.values(serviceSections).forEach(section => {

        section.style.display = "none";

        section.querySelectorAll("input, select, textarea").forEach(field => {

            field.disabled = true;
            field.required = false;

        });

    });


    const activeSection = serviceSections[serviceType.value];

    if (!activeSection) {
        return;
    }


    activeSection.style.display = "block";

    activeSection.querySelectorAll("input, select, textarea").forEach(field => {

        field.disabled = false;

    });


    /* งานช่าง */
    if (serviceType.value === "งานช่างซ่อมบำรุงและดูแลระบบสาธารณูปโภค") {

        document.getElementById("projectName").required = true;
        document.getElementById("unitCount").required = true;
        document.getElementById("staffCount").required = true;

    }


    /* งานบริหารนิติบุคคล */
    if (serviceType.value === "งานบริหารนิติบุคคล") {

        document.getElementById("managementProjectName").required = true;
        document.getElementById("managementUnitCount").required = true;
        document.getElementById("managementStaffCount").required = true;

    }


    /* งานจดจัดตั้งนิติบุคคล */
    if (serviceType.value === "งานจดจัดตั้งนิติบุคคล") {

        document.getElementById("establishmentProjectName").required = true;
        document.getElementById("establishmentUnitCount").required = true;

    }


    /* งานจัดประชุมใหญ่ */
    if (serviceType.value === "งานจัดประชุมใหญ่") {

        document.getElementById("meetingProjectName").required = true;
        document.getElementById("meetingUnitCount").required = true;
        document.getElementById("meetingDate").required = true;

    }


    /* ล้างเครื่องปรับอากาศ */
    if (serviceType.value === "ล้างเครื่องปรับอากาศ") {

        document.getElementById("airconLocation").required = true;
        document.getElementById("airconType").required = true;
        document.getElementById("airconBTU").required = true;
        document.getElementById("airconCount").required = true;

    }


    /* CCTV */
    if (serviceType.value === "งานกล้อง CCTV") {

        document.getElementById("cctvLocation").required = true;
        document.getElementById("cctvType").required = true;
        document.getElementById("cctvCount").required = true;

    }


    /* อื่น ๆ */
    if (serviceType.value === "อื่น ๆ") {

        document.getElementById("otherServiceDetail").required = true;

    }

}


serviceType.addEventListener("change", updateServiceFields);


/* ประเภทแอร์อื่น ๆ */

const airconType = document.getElementById("airconType");
const airconOtherType = document.getElementById("airconOtherType");

airconType.addEventListener("change", function () {

    if (this.value === "อื่น ๆ") {

        airconOtherType.style.display = "block";
        airconOtherType.required = true;

    } else {

        airconOtherType.style.display = "none";
        airconOtherType.required = false;
        airconOtherType.value = "";

    }

});


/* เริ่มต้น */

updateServiceFields();

</script>


</body>
</html>
